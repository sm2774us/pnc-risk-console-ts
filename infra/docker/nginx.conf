# Non-root nginx on 8080. Serves the SPA, proxies /api to the BFF, adds security headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Ag-Grid injects style elements at runtime, hence style-src 'unsafe-inline'. Scripts stay strict.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://bff:3000;
    proxy_http_version 1.1;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
  }
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  # `expires` (not add_header) so the server-level security headers above are still inherited here.
  location ~* \.(?:js|css|svg|woff2?)$ { expires 1y; try_files $uri =404; }
  location / { expires -1; try_files $uri /index.html; }
}
