name: Housekeeping

# GitHub never prunes workflow history. Weekly (or on demand) keep only the newest successful run per
# workflow and delete everything else. Branch cleanup is automatic via --delete-branch-on-merge.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    name: prune (${{ matrix.workflow }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workflow: [pr-verification.yml, release.yml, housekeeping.yml, codeql.yml, deploy.yml]
    steps:
      - name: Delete failed, cancelled, skipped and timed-out runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          workflow: ${{ matrix.workflow }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: 'cancelled,failure,skipped,timed_out,action_required'
      - name: Delete all but the latest successful run
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          workflow: ${{ matrix.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
          delete_run_by_conclusion_pattern: 'success'
