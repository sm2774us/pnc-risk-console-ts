name: Release

# Flow: merge to main -> `plan` computes the next SemVer + changelog from Conventional Commits and
# shows it in the run summary -> `publish` WAITS for a reviewer to approve the `release` environment ->
# on approval: gate, bump, CHANGELOG.md, tag, GitHub Release, signed artifacts, GHCR images.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false # never cancel a release midway

permissions:
  contents: read

jobs:
  plan:
    name: plan (compute version and notes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - id: plan
        run: node tools/release.mjs plan

  publish:
    name: publish (approval required)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release # required reviewers configured on this environment = the manual approval gate
    permissions:
      contents: write # push release commit and tag, create the GitHub Release
      packages: write # push images to GHCR
      id-token: write # keyless signing (Sigstore)
      attestations: write # store provenance
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Optional RELEASE_TOKEN (PAT or app token) if the ruleset cannot list GitHub Actions as a bypass actor.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Quality gate on the exact commit being released
        run: npm run verify
      - name: Apply version, changelog and release notes
        run: node tools/release.mjs apply
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          # First release ships the seeded 1.0.0 entry, so there may be nothing to commit: tag the current commit.
          if git diff --cached --quiet; then
            echo "No version or changelog changes; tagging the current commit"
          else
            git commit -m "chore(release): v${VERSION} [skip ci]"
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
      - name: Push release commit and tag (fails early if the ruleset bypass is missing)
        run: git push origin HEAD:main --follow-tags
      - name: Package artifacts
        run: |
          mkdir -p release
          cp dist/apps/bff/main.mjs release/pnc-bff.mjs
          tar -czf release/pnc-web.tgz -C dist/apps/risk-console .
      - name: Attest build provenance (artifacts)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/pnc-bff.mjs
            release/pnc-web.tgz
      - id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: bff
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/bff.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}-bff:${{ env.VERSION }}
            ghcr.io/${{ steps.repo.outputs.lower }}-bff:latest
          cache-from: type=gha,scope=bff
      - id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}-web:${{ env.VERSION }}
            ghcr.io/${{ steps.repo.outputs.lower }}-web:latest
          cache-from: type=gha,scope=web
      - name: Attest image (bff)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.lower }}-bff
          subject-digest: ${{ steps.bff.outputs.digest }}
          push-to-registry: true
      - name: Attest image (web)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.lower }}-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" release/* --title "v${VERSION}" --notes-file RELEASE_NOTES.md --verify-tag
