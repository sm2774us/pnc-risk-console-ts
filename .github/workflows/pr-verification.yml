name: PR Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# A new push to the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  HUSKY: '0'

jobs:
  guard:
    name: guard (PR title, repo hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependabot and Renovate must not exist (no bot branches or PRs)
        run: |
          for f in .github/dependabot.yml .github/dependabot.yaml renovate.json .github/renovate.json; do
            if [ -e "$f" ]; then echo "::error file=$f::Automated dependency PRs are disabled by policy"; exit 1; fi
          done
      - name: PR title must be a Conventional Commit (it becomes the squash commit and drives releases)
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: verify (format, affected lint/typecheck/test/build, integration, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Nx needs history to compute affected projects
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - run: npm run format:check
      - name: Affected lint, typecheck, unit tests, builds
        run: npx nx affected -t lint,typecheck,test,build --parallel=3
      - name: BFF HTTP integration tests (when affected)
        run: npx nx affected -t test-integration
      - name: Release tooling tests
        run: npm run test:tools
      - name: Dependency audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e (Playwright and axe)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:bff
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/risk-console-e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker (build, hardened smoke)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/bff.Dockerfile
          load: true
          tags: pnc-bff:ci
          cache-from: type=gha,scope=bff
          cache-to: type=gha,mode=max,scope=bff
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          load: true
          tags: pnc-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: BFF runs read-only, no capabilities, non-root
        run: |
          docker run -d --name bff --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e NODE_ENV=development -e AUTH_MODE=demo -p 3000:3000 pnc-bff:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/readyz >/dev/null && break || sleep 1; done
          curl -fsS localhost:3000/readyz
          test -n "$(docker inspect -f '{{.Config.User}}' pnc-bff:ci)"
      - name: BFF refuses unsafe production configuration
        run: |
          if docker run --rm -e NODE_ENV=production pnc-bff:ci; then echo "must refuse to start"; exit 1; fi
      - name: Web image serves with a CSP header
        run: |
          docker run -d --name web --add-host bff:127.0.0.1 --read-only --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /var/run --cap-drop ALL -p 8080:8080 pnc-web:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz >/dev/null && break || sleep 1; done
          curl -fsSI localhost:8080/ | grep -i "content-security-policy"

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '~1.9'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate every environment (no backend, no credentials)
        run: |
          for d in infra/terraform/envs/*/; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  k8s:
    name: k8s (kustomize, kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kubeconform
        run: curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
      - name: Render and validate overlays
        run: |
          for o in dev prod; do
            kubectl kustomize "k8s/overlays/$o" | ./kubeconform -strict -summary -ignore-missing-schemas
          done

  # The ONLY required status check in the ruleset.
  ci-ok:
    name: ci-ok (required check)
    if: always()
    needs: [guard, verify, e2e, docker, terraform, k8s]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then exit 1; fi
