apiVersion: apps/v1
kind: Deployment
metadata: { name: bff, namespace: pnc-risk, labels: { app: bff } }
spec:
  replicas: 2
  selector: { matchLabels: { app: bff } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: bff } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: bff
          image: ghcr.io/sm2774us/pnc-risk-console-bff:latest
          ports: [{ containerPort: 3000, name: http }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: AUTH_MODE, value: jwt }
            - { name: CORS_ORIGINS, value: 'https://risk.example.com' }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bff-secrets, key: JWT_SECRET } }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { memory: 768Mi } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: bff, namespace: pnc-risk }
spec: { selector: { app: bff }, ports: [{ port: 3000, targetPort: http, name: http }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: bff, namespace: pnc-risk }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bff }
  minReplicas: 2
  maxReplicas: 6
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: bff, namespace: pnc-risk }
spec: { minAvailable: 1, selector: { matchLabels: { app: bff } } }
