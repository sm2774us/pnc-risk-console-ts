services:
  bff:
    build: { context: ., dockerfile: infra/docker/bff.Dockerfile }
    environment: { NODE_ENV: development, AUTH_MODE: demo, PORT: '3000', DATASET_SIZE: '50000', CORS_ORIGINS: 'http://localhost:8080' }
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    ports: ['8080:8080']
    depends_on: { bff: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
